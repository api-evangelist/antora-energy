aid: antora-energy
name: Antora Energy
description: 'Antora Energy is a San Jose, California clean-energy hardware company founded
  by Justin Briggs, Andrew Ponec and David Bierman that designs, manufactures and deploys
  factory-built thermal batteries for heavy industry, data centers and the grid. Antora''s
  system resistively heats blocks of solid carbon to temperatures up to 2,400C when
  electricity is cheapest, stores that energy for multiple days in a compact modular unit,
  and discharges it around the clock as radiant heat delivered directly to industrial
  processes or paired with off-the-shelf steam turbine equipment for firm power; the company
  also develops thermophotovoltaic (TPV) heat-to-power cells at what it describes as the
  world''s largest TPV manufacturing line. Its HeatCore product delivers heat up to 375C at
  300 kW-thermal per module, and its power block is rated at 50 MW-electric. Antora''s first
  giga-scale deployment, Project Big Stone, is a 5 GWh system of more than 200 thermal
  batteries at POET''s bioprocessing plant in Big Stone City, South Dakota, built from empty
  lot to energy delivery in under twelve months. The company closed a $550 million Series C
  in 2026. Antora sells energy hardware and long-term energy offtake rather than software:
  it publishes no developer program, no public API, no SDK and no machine-readable API
  contract, and its only public software surface is Insight, an authenticated steam and
  power optimization dashboard for named project stakeholders.'
